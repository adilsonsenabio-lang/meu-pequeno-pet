name: Publicar Meu Pequeno Pet (GitHub Pages)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4
      - name: Preparar sprites, movimentos e fundos da V84.29
        run: |
          python3 -m pip install --disable-pip-version-check Pillow
          python3 scripts/generate_v8429.py
      - name: Atualizar cache incremental
        run: python3 scripts/update_sw.py
      - name: Verificar integridade do jogo
        run: python3 scripts/verify_pages.py
      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Enviar jogo
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./web
      - name: Publicar endereço fixo
        id: deployment
        uses: actions/deploy-pages@v4
